<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jinja-render — Jinja2 playground</title>
    <!-- Inline SVG favicon (data URI): avoids a /favicon.ico request that the SPA
         catch-all would otherwise answer with index.html as text/html. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e1e2e'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%237c8cff' font-family='monospace'%3E%7B%7D%3C/text%3E%3C/svg%3E"
    />
    <meta name="color-scheme" content="dark light" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Optional runtime CSS override (e.g. mounted from a Kubernetes ConfigMap).
      Loaded last so it can override bundled styles via the CSS cascade.
      FastAPI serves an empty no-op stylesheet when no file is mounted, so a
      missing override never 404s or breaks the page. In local Vite dev the
      request simply yields nothing and is safely ignored.
    -->
    <link rel="stylesheet" href="/custom.css" />
  </body>
</html>
